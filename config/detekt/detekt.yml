# CloakRun detekt configuration (detekt 2.0). Builds on the default config; only deviations are listed.

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  # Compose files are named after their main composable, not after a supporting enum or state class.
  MatchingDeclarationName:
    active: false
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
    ignoreDefaultParameters: true
  LongMethod:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreSimpleWhenEntries: true
  # Small composables are the unit of reuse; counting them as "functions" penalises good structure.
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Composable', 'Preview']

style:
  # Design tokens, colour science and geometry are numeric by nature; named constants are used
  # where a number carries meaning outside its immediate context.
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']

Compose:
  ModifierMissing:
    active: true
  CompositionLocalAllowlist:
    active: true
    allowedCompositionLocals:
      - LocalCloakColors
      - LocalCloakTypography
      - LocalCloakSpacing
      - LocalCloakRadii
      - LocalCloakSizes
      - LocalCloakBlur
      - LocalCloakMotion
      - LocalGlassBackdrop
      - LocalGlassQuality
      - LocalTilt
      - LocalCloakHaptics
      - LocalMapOverlayContributors
      - LocalTopChromeInset
