# CloakRun detekt configuration (detekt 2.0). Builds on the default config; only deviations are listed.

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
    ignoreDefaultParameters: true
  LongMethod:
    ignoreAnnotated: ['Composable']

style:
  # Design tokens, colour science and geometry are numeric by nature; named constants are used
  # where a number carries meaning outside its immediate context.
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']

Compose:
  ModifierMissing:
    active: true
  CompositionLocalAllowlist:
    active: true
    allowedCompositionLocals:
      - LocalCloakColors
      - LocalCloakTypography
      - LocalCloakSpacing
      - LocalCloakRadii
      - LocalCloakSizes
      - LocalCloakBlur
      - LocalCloakMotion
