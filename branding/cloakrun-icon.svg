<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="CloakRun app icon">
  <defs>
    <linearGradient id="bg" x1="140" y1="0" x2="880" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D1157"/>
      <stop offset="0.55" stop-color="#0E0A2B"/>
      <stop offset="1" stop-color="#060514"/>
    </linearGradient>
    <radialGradient id="aura" cx="512" cy="470" r="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.60"/>
      <stop offset="0.5" stop-color="#3B2BB8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#3B2BB8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloak" x1="330" y1="250" x2="560" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6F3FF"/>
      <stop offset="0.30" stop-color="#BBAAFF"/>
      <stop offset="0.58" stop-color="#7358F6" stop-opacity="1"/>
      <stop offset="0.76" stop-color="#5A41E0" stop-opacity="0.55"/>
      <stop offset="0.92" stop-color="#4A34C8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3322B0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="330" y1="250" x2="560" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.9" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="void" x1="512" y1="336" x2="512" y2="575" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04030D"/>
      <stop offset="1" stop-color="#1A0F4A"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="512" cy="446" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5CF2FF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#5CF2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arcCyan" x1="262" y1="440" x2="512" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5CF2FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#5CF2FF" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="arcViolet" x1="762" y1="440" x2="512" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A48CFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#A48CFF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="frameRim" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1024" height="1024" rx="228"/>
    </clipPath>
    <filter id="blur14" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#aura)"/>
    <path d="M0 0H1024V400C800 310 224 310 0 400Z" fill="#FFFFFF" opacity="0.035"/>

    <!-- radar rings -->
    <g fill="none" stroke="#FFFFFF" stroke-width="2">
      <circle cx="512" cy="440" r="250" opacity="0.10"/>
      <circle cx="512" cy="440" r="340" opacity="0.07"/>
      <circle cx="512" cy="440" r="430" opacity="0.05"/>
    </g>

    <!-- bright radar arcs -->
    <g fill="none" stroke-linecap="round" stroke-width="10">
      <path d="M262 440 A250 250 0 0 1 512 190" stroke="url(#arcCyan)"/>
      <path d="M762 440 A250 250 0 0 1 512 690" stroke="url(#arcViolet)"/>
    </g>

    <!-- cloak / hood pin, dissolving toward the tip -->
    <g>
      <path d="M512 800 C430 700 322 600 322 440 A190 190 0 0 1 702 440 C702 600 594 700 512 800Z" fill="url(#cloak)"/>
      <path d="M512 800 C430 700 322 600 322 440 A190 190 0 0 1 702 440 C702 600 594 700 512 800Z" fill="none" stroke="url(#rim)" stroke-width="4"/>
      <ellipse cx="420" cy="350" rx="58" ry="118" transform="rotate(28 420 350)" fill="url(#spec)"/>
    </g>

    <!-- hood opening -->
    <path d="M512 575 C466 535 408 495 408 440 A104 104 0 0 1 616 440 C616 495 558 535 512 575Z" fill="url(#void)"/>
    <path d="M512 575 C466 535 408 495 408 440 A104 104 0 0 1 616 440 C616 495 558 535 512 575Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>

    <!-- signal eye -->
    <circle cx="512" cy="446" r="110" fill="url(#eyeGlow)"/>
    <circle cx="512" cy="446" r="64" fill="none" stroke="#5CF2FF" stroke-opacity="0.40" stroke-width="3"/>
    <circle cx="512" cy="446" r="92" fill="none" stroke="#5CF2FF" stroke-opacity="0.16" stroke-width="3"/>
    <circle cx="512" cy="446" r="30" fill="#5CF2FF" filter="url(#blur6)" opacity="0.9"/>
    <circle cx="512" cy="446" r="26" fill="#C9FBFF"/>
    <circle cx="505" cy="438" r="8" fill="#FFFFFF" opacity="0.9"/>

    <!-- dissolving pixels -->
    <g fill="#A48CFF">
      <rect x="520" y="742" width="26" height="26" rx="7" opacity="0.85"/>
      <rect x="556" y="772" width="20" height="20" rx="6" opacity="0.75"/>
      <rect x="498" y="800" width="16" height="16" rx="5" opacity="0.70"/>
      <rect x="590" y="806" width="14" height="14" rx="4" opacity="0.60"/>
      <rect x="540" y="836" width="12" height="12" rx="4" opacity="0.50"/>
      <rect x="628" y="842" width="10" height="10" rx="3" opacity="0.42"/>
      <rect x="574" y="872" width="9" height="9" rx="3" opacity="0.34"/>
      <rect x="500" y="858" width="8" height="8" rx="2.5" opacity="0.30"/>
      <rect x="668" y="880" width="7" height="7" rx="2" opacity="0.24"/>
      <rect x="610" y="908" width="6" height="6" rx="2" opacity="0.18"/>
      <rect x="540" y="914" width="6" height="6" rx="2" opacity="0.15"/>
      <rect x="700" y="918" width="5" height="5" rx="1.5" opacity="0.12"/>
    </g>
    <g fill="#5CF2FF">
      <rect x="588" y="758" width="12" height="12" rx="4" opacity="0.70"/>
      <rect x="470" y="772" width="9" height="9" rx="3" opacity="0.55"/>
      <rect x="640" y="816" width="8" height="8" rx="2.5" opacity="0.40"/>
      <rect x="520" y="888" width="7" height="7" rx="2" opacity="0.28"/>
    </g>
  </g>

  <rect x="2" y="2" width="1020" height="1020" rx="226" fill="none" stroke="url(#frameRim)" stroke-width="4"/>
</svg>
